services:
  - type: web
    name: zuvadox
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_ROOT
        value: /opt/render/project/src/storage
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 10
